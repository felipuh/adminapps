name: AdminApps CI Product Authority

on:
  push:
    branches:
      - development
      - main
      - master
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'docs/**'
      - '.github/workflows/adminapps-ci.yml'
  pull_request:
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'docs/**'
      - '.github/workflows/adminapps-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: adminapps-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend Product Authority Tests
    runs-on: ubuntu-latest

    env:
      BILLING_SCHEDULER_ENABLED: 'false'
      ENVIRONMENT: test
      SECURE_SSL_REDIRECT: 'False'
      SECURE_HSTS_SECONDS: '0'
      SESSION_COOKIE_SECURE: 'False'
      CSRF_COOKIE_SECURE: 'False'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Django check
        working-directory: backend
        run: python manage.py check --settings=config.settings_test

      - name: Migration drift check
        working-directory: backend
        run: python manage.py makemigrations --check --dry-run --settings=config.settings_test

      - name: Product authority tests
        working-directory: backend
        run: python manage.py test apps.products apps.billing apps.users apps.api --settings=config.settings_test

      - name: Production-like deploy check
        working-directory: backend
        env:
          ENVIRONMENT: production
          DEBUG: 'False'
          DJANGO_SECRET_KEY: ci-production-like-secret-key-7f9c1a42b8e64d5fa37c2e19d0ab8642
          ALLOWED_HOSTS: adminapps.example.test
          CORS_ALLOWED_ORIGINS: https://adminapps.example.test,https://medsupplier.example.test
          CSRF_TRUSTED_ORIGINS: https://adminapps.example.test,https://medsupplier.example.test
          SESSION_COOKIE_SECURE: 'True'
          CSRF_COOKIE_SECURE: 'True'
          SECURE_SSL_REDIRECT: 'True'
          SECURE_HSTS_SECONDS: '31536000'
          SECURE_HSTS_INCLUDE_SUBDOMAINS: 'True'
          SECURE_HSTS_PRELOAD: 'False'
        run: python manage.py check --deploy --settings=config.settings

  frontend:
    name: Frontend Lint And Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint frontend
        working-directory: frontend
        run: npm run lint

      - name: Build frontend
        working-directory: frontend
        run: npm run build
