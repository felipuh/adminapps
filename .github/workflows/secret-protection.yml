name: Sanitized secret protection
on:
  push:
    branches: [security/rec-git-sec-01-20261021]
  pull_request:
    branches: [security/rec-git-sec-01-20261021]
permissions:
  contents: read
jobs:
  secret-protection:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout event head without persisted credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Fetch only event ancestry and load trusted guard
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
          TRUSTED_ROOT: ab54411ad4bccaed536558bed17e5973f9b822e9
        shell: bash
        run: |
          set -euo pipefail
          # Token stays in memory, is never persisted or printed.
          auth=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" fetch --no-tags --unshallow origin "$EVENT_HEAD"
          unset auth GH_TOKEN
          test "$(git rev-list --max-parents=0 HEAD)" = "$TRUSTED_ROOT"
          mkdir -p "$RUNNER_TEMP/trusted/scripts/security"
          for name in check_secrets.py reviewed-findings.json test_guard.py; do
            git show "$TRUSTED_ROOT:scripts/security/$name" > "$RUNNER_TEMP/trusted/scripts/security/$name"
          done
      - name: Install checksum-verified Gitleaks 8.30.1
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            -o "$RUNNER_TEMP/gitleaks.tar.gz"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum --check --status
          mkdir -p "$RUNNER_TEMP/scanner"
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP/scanner" gitleaks
      - name: Test guard and audit all publishable event history
        env:
          GITLEAKS: ${{ runner.temp }}/scanner/gitleaks
        run: |
          python3 "$RUNNER_TEMP/trusted/scripts/security/test_guard.py"
          python3 "$RUNNER_TEMP/trusted/scripts/security/check_secrets.py" --ref HEAD
